<!doctype html>
<html><head><meta charset="utf-8"><title>Sprite cutter</title></head>
<body style="background:#2a2a30;color:#ddd;font:12px monospace;margin:8px">
<!--
  Turns design sheets into clean game sprites for one character.
  Run it through tools/build_sprites.py (it serves the repo and reads the result),
  or open  http://localhost:8765/tools/sprite-cutter.html?char=alba&debug=1  to see
  the detected figures, their pose names and the extracted frames.
-->
<pre id="out"></pre>
<div id="dbg"></div>
<script src="sprites.config.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search), CHAR = Q.get('char'), DEBUG = !!Q.get('debug');
const OUT = document.getElementById('out'), DBG = document.getElementById('dbg');
const log = [];

// ---------- image helpers ----------
const loadImage = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('cannot load ' + src)); im.src = src; });

function pixelsOf(im, area) { const [ax, ay, aw, ah] = area || [0, 0, im.naturalWidth, im.naturalHeight], c = document.createElement('canvas'); c.width = aw; c.height = ah; const g = c.getContext('2d'); g.fillStyle = '#ff00ff'; g.fillRect(0, 0, aw, ah); /* transparent PNGs -> magenta background */ g.drawImage(im, -ax, -ay); return { w: c.width, h: c.height, d: g.getImageData(0, 0, c.width, c.height).data }; }
const dist2 = (r, g, b, c) => (r - c[0]) ** 2 + (g - c[1]) ** 2 + (b - c[2]) ** 2;

// ---------- 1. background colours (from the sheet borders; handles flat and checker backgrounds) ----------

// background = background-coloured pixels connected to the sheet edge, or forming a big gap

// ---------- 2. figures = connected components of the foreground ----------

    log.push(`${sh.src}: ${P.w}x${P.h}, bg ${bg.map(c => c.map(Math.round).join(',')).join(' | ')}, ${figs.length} figures, ${sh.poses.length} names`);
    if (DEBUG) debugSheet(im, figs, sh.poses, sh.area);
    const prof = figs.map(b => ({ x: edgeProfile(P, b, 'x'), y: edgeProfile(P, b, 'y') }));
    // Every sheet is scaled so its fight stance (stance or idle_1) is `height` art pixels tall (88), or as
    // tall as the stance already cut from an earlier sheet: all frames of all characters share one size.
    // (keepGrid: true keeps a crisp detected grid instead.)
    const det = sheetGrid(prof.flatMap(q => [q.x, q.y]));
    let si = sh.poses.indexOf('stance'); if (si < 0) si = sh.poses.indexOf('idle_1');
    const refH = frames.stance ? frames.stance.h : (cfg.height || 88);
    let p = det.p, how = 'detected';
    if (sh.grid) { p = sh.grid; how = 'config'; }
    else if (sh.match && frames[sh.match[1]] && figs[sh.poses.indexOf(sh.match[0])]) { // sheet drawn at another size:
      const fig = figs[sh.poses.indexOf(sh.match[0])], ref = frames[sh.match[1]];         // match a pose already cut
      if (sh.matchBy === 'head') { p = headWidthImg(P, m, fig, comps.lab) / headWidthArt(ref); how = `${sh.match[0]} head = ${sh.match[1]} head`; }
      else { p = fig.h / ref.h; how = `${sh.match[0]} = ${sh.match[1]} height`; }
    }
    else if (si >= 0 && figs[si] && (det.score < 1.2 || frames.stance || frames.idle_1 || !cfg.keepGrid)) { p = figs[si].h / refH; how = 'stance height ' + refH; }
    log.push(`  art pixel = ${p.toFixed(2)} image px (${how}; grid fit ${det.score.toFixed(2)})`);
    figs.forEach((b, i) => {
      const name = sh.poses[i]; if (!name || name === 'skip' || name[0] === '_') return; // '_ref': only used to measure the size
      const fx = phaseFit(prof[i].x, p), fy = phaseFit(prof[i].y, p);
      const pp = p / ((cfg.scale && cfg.scale[name]) || 1); // per-pose size fix (a row drawn smaller by the AI)
      const fx2 = pp === p ? fx : phaseFit(prof[i].x, pp), fy2 = pp === p ? fy : phaseFit(prof[i].y, pp);
      let F = despeckle(sampleFigure(P, m, b, { p: pp, phx: fx2.ph, phy: fy2.ph }, comps.lab, bg, tol));
      for (const [x, y, w, h] of (cfg.erase && cfg.erase[name]) || []) for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (xx >= 0 && yy >= 0 && xx < F.w && yy < F.h) F.px[(yy * F.w + xx) * 4 + 3] = 0;
      if (cfg.erase && cfg.erase[name]) F = trim(F);
      if (flips.has(name)) F = flipH(F);
      frames[name] = F;
      log.push(`  ${name}: ${F.w}x${F.h} (fit x ${fx.score.toFixed(2)} / y ${fy.score.toFixed(2)})`);
    });
  }
  // aliases: one drawing used for two poses (e.g. Alba's flip-kick crouch is also her jump take-off)
  for (const [to, from] of Object.entries(cfg.alias || {})) if (frames[from] && !frames[to]) frames[to] = frames[from];
  // palette
  const all = []; for (const F of Object.values(frames)) for (let i = 0; i < F.w * F.h; i++) if (F.px[i * 4 + 3]) all.push([F.px[i * 4], F.px[i * 4 + 1], F.px[i * 4 + 2]]);
  const pal = medianCut(all, cfg.colors || 40); for (const F of Object.values(frames)) applyPalette(F, pal);
  // atlas items: frames + portraits
  const items = [], meta = { frames: {}, portraits: {} };
  for (const [name, F] of Object.entries(frames)) { const a = bodyAnchor(F); a.ax += (cfg.dx && cfg.dx[name]) || 0; items.push({ kind: 'f', name, F, a }); }
  for (const [expr, src] of Object.entries(cfg.portraits || {})) { const F = frames[src]; if (!F) continue; const r = (cfg.faceRect && cfg.faceRect[src]) || headCrop(F); items.push({ kind: 'p', name: expr, F: crop(F, r) }); }
  const size = pack(items);
  for (const it of items) {
    if (it.kind === 'f') meta.frames[it.name] = { x: it.x, y: it.y, w: it.F.w, h: it.F.h, ax: +it.a.ax.toFixed(1), ay: it.a.ay };
    else meta.portraits[it.name] = { x: it.x, y: it.y, w: it.F.w, h: it.F.h };
  }
  const st = frames.stance || frames.idle_1 || Object.values(frames)[0];
  meta.height = st.h; meta.size = size; meta.body = cfg.body !== false;
  const main = atlasCanvas(items, size), alt = atlasCanvas(items, size, altColor);
  if (DEBUG) debugFrames(items, alt);
  return { id, meta, png: main.toDataURL('image/png'), altPng: alt.toDataURL('image/png'), log };
}

// ---------- debug views ----------
function debugSheet(im, figs, names, area) {
  const [ax, ay, aw, ah] = area || [0, 0, im.naturalWidth, im.naturalHeight], c = document.createElement('canvas'); c.width = aw; c.height = ah; const g = c.getContext('2d'); g.drawImage(im, -ax, -ay);
  g.lineWidth = 2; g.font = 'bold 16px monospace';
  figs.forEach((b, i) => { g.strokeStyle = '#ff00ff'; g.strokeRect(b.x, b.y, b.w, b.h); g.fillStyle = '#000'; g.fillRect(b.x, b.y - 18, 150, 18); g.fillStyle = '#0f0'; g.fillText(i + ': ' + (names[i] || '?'), b.x + 2, b.y - 4); });
  DBG.appendChild(c);
}
function debugFrames(items, alt) {
  const z = 4, wrap = document.createElement('div'); wrap.style = 'display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:#8a9ab0;padding:8px';
  for (const it of items) { const c = frameCanvas(it.F, z), box = document.createElement('div'); box.style = 'text-align:center;color:#000'; box.appendChild(c); box.appendChild(document.createElement('br')); box.appendChild(document.createTextNode(it.name + ' ' + it.F.w + 'x' + it.F.h)); wrap.appendChild(box); }
  DBG.appendChild(wrap);
  const a = document.createElement('img'); a.src = alt.toDataURL(); a.style = 'image-rendering:pixelated;width:' + alt.width * 2 + 'px;background:#8a9ab0;margin-top:8px'; DBG.appendChild(a);
}

// inspect mode: ?src=images/...png shows the detected figures of any image, numbered in reading order
async function inspect(src, tol) {
  const im = await loadImage('../' + src), P = pixelsOf(im), bg = bgColors(P), m = fgMask(P, bg, tol);
  const figs = figures(P, components(P, m), Q.get('props'));
  const c = document.createElement('canvas'); c.width = P.w; c.height = P.h; const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  g.lineWidth = 3; g.font = 'bold 34px monospace';
  figs.forEach((b, i) => { g.strokeStyle = '#00ff00'; g.strokeRect(b.x, b.y, b.w, b.h); g.fillStyle = '#000'; g.fillRect(b.x, b.y, 56, 38); g.fillStyle = '#ffff00'; g.fillText(i, b.x + 4, b.y + 30); });
  DBG.appendChild(c);
  return `${src}: ${figs.length} figures, heights ${figs.map(b => b.h).join(' ')}`;
}
if (Q.get('src')) inspect(Q.get('src'), +(Q.get('tol') || 24)).then(t => { OUT.textContent = t; document.title = 'DONE'; }, e => { OUT.textContent = String(e); });
else build(CHAR).then(r => { OUT.textContent = DEBUG ? r.log.join('\n') : JSON.stringify(r); document.title = 'DONE'; })
  .catch(e => { OUT.textContent = JSON.stringify({ error: String(e.stack || e), log }); document.title = 'ERROR'; });
</script>
